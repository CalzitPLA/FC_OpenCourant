# References: 
# https://packaging.python.org/en/latest/specifications/declaring-project-metadata/
# https://packaging.python.org/en/latest/guides/packaging-namespace-packages/#native-namespace-packages
# https://packaging.python.org/en/latest/guides/single-sourcing-package-version/
# https://setuptools.pypa.io/en/latest/userguide/pyproject_config.html

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "freecad.ORfemn"
dynamic = ["version"]
description = "OpenRadioss / LS-DYNA keyword workbench for FreeCAD"
readme = "README.md"
license = {file = "LICENSE"}
maintainers = [
    {name = "Nicholas Herrmann", email = "nicholas.herrmann@proton.me"},
]
requires-python = ">=3.8"
dependencies = []

[project.urls]
source = "https://hexascan.de"

[tool.setuptools]
packages = ["freecad.ORfemn", "freecad.ORfemn.commands", "freecad.ORfemn.gui", "freecad.ORfemn.fem"]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "freecad.ORfemn.version.__version__"}

[tool.setuptools.package-data]
"freecad.ORfemn" = ["*.json", "resources/icons/*.svg", "resources/translations/*"]
